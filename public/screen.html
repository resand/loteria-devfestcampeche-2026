<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotería · Pantalla</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#F0F0F0">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; padding: 80px 100px; transform-origin: center; display: flex; flex-direction: column; }
    .t1 { font-size: 120px; line-height: 1; font-weight: 700; letter-spacing: -2px; }
    .t2 { font-size: 64px; line-height: 1.05; font-weight: 700; }
    .t3 { font-size: 36px; }
    .row { display: flex; gap: 60px; align-items: center; flex: 1; }
    .qr { width: 380px; height: 380px; padding: 16px; background: #fff; border: 2px solid var(--ink); border-radius: 32px; }
    .stats { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 40px; }
    .stat { font-size: 32px; } .stat b { font-size: 72px; display: block; line-height: 1; }
    .grid { display: grid; gap: 14px; font-size: 13px; }
    .grid .card { animation: pop .6s cubic-bezier(.3,1.5,.5,1) both; }
    @keyframes pop { from { transform: scale(.3) rotate(-8deg); opacity: 0; } }
    .cmd { font: 32px/1.6 ui-monospace, Menlo, monospace; background: var(--ink); color: #fff; border-radius: 28px; padding: 32px 40px; }
    .cmd i { color: #9aa0a6; font-style: normal; }
    #ssenet .ph { transform-box: fill-box; transform-origin: center; }
    .cmp { border-collapse: collapse; font-size: 26px; width: 100%; } .cmp th, .cmp td { border: 2px solid var(--ink); padding: 8px 14px; text-align: left; vertical-align: top; } .cmp th { background: var(--pastel); }
    .cmp td:first-child { font-weight: 700; background: #fff; }
    .cmd-inline { font: 30px ui-monospace, Menlo, monospace; background: var(--ink); color: #fff; border-radius: 12px; padding: 2px 14px; }
    .big { width: 520px; font-size: 44px; flex: none; }
    .big .card { animation: flip .7s both; }
    @keyframes flip { from { transform: rotateY(90deg) scale(.8); } }
    .history { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; font-size: 8px; align-content: start; }
    .history .card:first-child { outline: 5px solid var(--yellow); outline-offset: 2px; }
    .win { position: absolute; inset: 0; display: grid; place-items: center; background: #1E1E1Ef2; color: #fff; text-align: center; animation: pop .5s both; }
    .podium { display: flex; gap: 40px; align-items: flex-end; }
    .podium > div { text-align: center; font-size: 40px; font-weight: 700; }
    .podium .card { width: 280px; font-size: 24px; margin-bottom: 16px; }
    #bursts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .burst { position: absolute; font-size: 44px; font-weight: 700; animation: rise 1.8s ease-out forwards; text-shadow: 0 2px 0 #fff; }
    @keyframes rise { from { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-30px) scale(1.1); } to { transform: translateY(-260px) scale(1); opacity: 0; } }
    .walk-dots { display: flex; gap: 12px; } .walk-dots i { width: 58px; height: 14px; border-radius: 99px; transition: opacity .3s; }
    .walk-step { position: absolute; top: 50px; left: 0; right: 0; opacity: 0; translate: 0 24px; transition: opacity .35s, translate .35s; }
    .walk-step.on { opacity: 1; translate: 0 0; }
    .walk-phone { position: relative; flex: none; width: 360px; height: 760px; border: 8px solid var(--ink); border-radius: 48px; overflow: hidden; background: #000; }
    .walk-phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .35s; }
    .walk-phone img.on { opacity: 1; }
    #sound { position: fixed; inset: 0; display: grid; place-items: center; background: #F0F0F0ee; font-size: 40px; cursor: pointer; z-index: 9; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="sound">🔊 Clic para activar el sonido</div>
  <script type="module" src="screen.js"></script>
</body>
</html>
